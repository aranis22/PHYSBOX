[platformio]
default_envs = physbox

[env:physbox]
; Pinned pioarduino release: Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5.
; The stock PlatformIO Espressif platform still carries Arduino-ESP32 2.x,
; which does not provide the ESP_I2S.h API used by the proven microphone code.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; The exact N16R8 board definition selects 16 MB QIO flash, 8 MB octal
; PSRAM, qio_opi memory mode, and the default_16MB partition table.
; The proven Arduino configuration uses ESP32-S3 hardware-CDC mode with
; CDC-on-boot disabled. Keep the same runtime selection here.
build_flags =
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    https://github.com/tdk-invn-oss/motion.arduino.ICM42670P.git#1.0.9
